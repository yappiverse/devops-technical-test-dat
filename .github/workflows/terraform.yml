name: "Terraform Production GitOps"

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate:
    name: "1. Lint & Syntax Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive

      - name: "Terraform Validate Syntax"
        run: |
          terraform init -backend=false
          terraform validate

  plan:
    name: "2. Dry-Run Plan (Read-Only)"
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_REGION: "ap-southeast-1"
      ROLE_TO_ASSUME: ${{ secrets.AWS_OIDC_PLAN_ROLE_ARN || secrets.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::123456789012:role/github-actions-terraform-plan-role' }}

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: "Configure AWS Credentials via OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: "sts.amazonaws.com"

      - name: "Terraform Init with Remote Backend"
        run: terraform init

      - name: "Run Terraform Plan (Preview Only)"
        id: plan
        run: |
          terraform plan -var-file=terraform.tfvars -no-color -out=tfplan > plan_output.txt
          cat plan_output.txt

      - name: "Post Plan Diff to Pull Request"
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            let plan = 'No output';
            try {
              plan = fs.readFileSync('terraform/plan_output.txt', 'utf8');
              if (plan.length > 60000) {
                plan = plan.substring(plan.length - 60000);
              }
            } catch (err) {
              plan = 'Error reading plan output: ' + err;
            }
            const body = '#### Terraform Plan Result (Read-Only Preview)\n' +
              '<details><summary>Click to expand plan output</summary>\n\n' +
              '```text\n' + plan + '\n```\n' +
              '</details>\n\n*Pusher: @' + context.actor + ', Action: `' + context.eventName + '`*';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  apply:
    name: "3. Apply to Production"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    environment:
      name: production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_REGION: "ap-southeast-1"
      ROLE_TO_ASSUME: ${{ secrets.AWS_OIDC_APPLY_ROLE_ARN || secrets.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::123456789012:role/github-actions-terraform-apply-role' }}

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: "Configure AWS Credentials via OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: "sts.amazonaws.com"

      - name: "Terraform Init with Remote Backend"
        run: terraform init

      - name: "Execute Terraform Apply (Live Production)"
        run: |
          terraform apply -auto-approve -var-file=terraform.tfvars
